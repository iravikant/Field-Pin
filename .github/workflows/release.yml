name: Release APK

# Push a tag such as v1.0.0 to build the APK and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk FieldPin-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: FieldPin-${{ github.ref_name }}.apk
